name: Release

# Push a tag like v0.3.0 (matching CFBundleShortVersionString in
# app/Support/Info.plist) to build, zip and publish a GitHub Release whose
# notes are that version's section of CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    # Xcode 26 SDK, so the release has Liquid Glass in the overflow bar.
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Version matches tag
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Info.plist says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Bundle and zip
        run: |
          scripts/bundle.sh release
          ditto -c -k --keepParent build/Wingbar.app "build/Wingbar-$VERSION-macOS.zip"

      - name: Release notes
        run: |
          # This version's CHANGELOG section (up to the next "## " heading).
          awk -v ver="$VERSION" '
            index($0, "## " ver) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' ../CHANGELOG.md > build/notes.md
          if [ ! -s build/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat >> build/notes.md <<NOTES

          ### Install
          1. Download **Wingbar-$VERSION-macOS.zip**, unzip it, and move **Wingbar** to Applications.
          2. Open it. The app isn't notarized yet, so the first time macOS blocks it: open **System Settings → Privacy & Security** and click **Open Anyway** next to Wingbar.
          3. Grant **Accessibility** when asked (required). **Screen Recording** is optional; it lets the Left Wing show each icon exactly as it looks.

          After updating, macOS may ask for the permissions again, because each build has a new signature.
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Wingbar-$VERSION-macOS.zip" \
            --title "Wingbar $VERSION" \
            --notes-file build/notes.md \
            --verify-tag
